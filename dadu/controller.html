<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Controller</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e8eaed;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wrap{width:100%;max-width:360px;padding:20px}
h1{text-align:center;font-size:20px;font-weight:500;margin-bottom:24px;color:#8ab4f8}
.room-input{display:flex;gap:8px;margin-bottom:28px}
.room-input input{flex:1;height:48px;background:#16213e;border:2px solid #333;border-radius:12px;color:#fff;font-size:18px;text-align:center;letter-spacing:4px;text-transform:uppercase;outline:none;font-weight:600}
.room-input input:focus{border-color:#8ab4f8}
.room-input button{height:48px;padding:0 20px;background:#336EF3;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.room-input button:active{opacity:.8}
.status{text-align:center;font-size:13px;margin-bottom:20px;padding:6px 14px;border-radius:8px;display:inline-block}
.status.idle{color:#9aa0a6}
.status.ok{background:#1b3a2a;color:#34A853}
.status.err{background:#3a1b1b;color:#EA4335}
.status-wrap{text-align:center;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.num{height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;cursor:pointer;border:none;color:#fff;transition:transform .1s,box-shadow .15s}
.num:active{transform:scale(.93)}
.num.selected{box-shadow:0 0 0 3px #fff,0 0 20px rgba(138,180,248,.4)}
.n1{background:linear-gradient(135deg,#EA4335,#c62828)}.n2{background:linear-gradient(135deg,#FBBC05,#f9a825)}.n3{background:linear-gradient(135deg,#34A853,#2e7d32)}.n4{background:linear-gradient(135deg,#4285F4,#1565c0)}.n5{background:linear-gradient(135deg,#9C27B0,#6a1b9a)}.n6{background:linear-gradient(135deg,#FF6D00,#e65100)}
.mode{display:flex;gap:8px;justify-content:center}
.mode button{padding:10px 20px;border:2px solid #333;background:transparent;color:#e8eaed;border-radius:10px;font-size:13px;cursor:pointer}
.mode button.active{border-color:#8ab4f8;color:#8ab4f8;background:rgba(138,180,248,.1)}
.hint{text-align:center;margin-top:16px;font-size:12px;color:#666}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dice Remote</h1>

  <div class="room-input">
    <input type="text" id="roomInput" placeholder="KODE" maxlength="4" autocomplete="off" spellcheck="false">
    <button onclick="connect()">Hubungkan</button>
  </div>

  <div class="status-wrap">
    <span class="status idle" id="status">Belum terhubung</span>
  </div>

  <div class="grid">
    <button class="num n1" onclick="pick(1)">1</button>
    <button class="num n2" onclick="pick(2)">2</button>
    <button class="num n3" onclick="pick(3)">3</button>
    <button class="num n4" onclick="pick(4)">4</button>
    <button class="num n5" onclick="pick(5)">5</button>
    <button class="num n6" onclick="pick(6)">6</button>
  </div>

  <div class="mode">
    <button class="active" id="modeSet" onclick="setMode('set')">Set saja</button>
    <button id="modeRoll" onclick="setMode('roll')">Set + Lempar</button>
  </div>

  <div class="hint">Set saja = angka disiapkan, lempar manual di HP.<br>Set + Lempar = langsung lempar otomatis.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
let conn = null;
let mode = 'set';
let selected = null;

// Auto-fill from URL
const params = new URLSearchParams(location.search);
if(params.get('r')) document.getElementById('roomInput').value = params.get('r').toUpperCase();

function connect(){
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if(!code) return;
  const st = document.getElementById('status');
  st.textContent = 'Menghubungkan...';
  st.className = 'status idle';

  const peer = new Peer();
  peer.on('open', function(){
    conn = peer.connect('dadu-' + code.toLowerCase());
    conn.on('open', function(){
      st.textContent = 'Terhubung ke ' + code;
      st.className = 'status ok';
    });
    conn.on('close', function(){
      st.textContent = 'Terputus';
      st.className = 'status err';
      conn = null;
    });
    conn.on('error', function(){
      st.textContent = 'Error koneksi';
      st.className = 'status err';
    });
  });
  peer.on('error', function(e){
    st.textContent = 'Gagal: ' + (e.type || e.message);
    st.className = 'status err';
  });
}

function pick(n){
  document.querySelectorAll('.num').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.num')[n-1].classList.add('selected');
  selected = n;
  if(conn){
    conn.send({type: mode, value: n});
  }
}

function setMode(m){
  mode = m;
  document.getElementById('modeSet').className = m === 'set' ? 'active' : '';
  document.getElementById('modeRoll').className = m === 'roll' ? 'active' : '';
}
</script>
</body>
</html>
